[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geniac-secbench"
version = "1.0.0"
description = "GenIaC-SecBench: a security evaluation benchmark for LLM-generated Infrastructure-as-Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
geniac = "geniac_secbench.cli:main"
